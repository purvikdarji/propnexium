# PropNexium Custom Properties
propnexium.app.name=PropNexium
propnexium.app.version=1.0.0
propnexium.upload.directory=uploads
propnexium.app.base-url=http://localhost:8080

# Logging
logging.level.com.propnexium=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.apache.jasper=DEBUG

# Async executor thread pool (for @Async email sending — legacy fallback path)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# Jackson: serialize null dates as null instead of throwing
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Session timeout: 60 minutes
server.servlet.session.timeout=60m

# Error handling: show full error page in dev
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ─── Apache Kafka ────────────────────────────────────────────────────────────
# Bootstrap server — localhost:29092 for local dev outside Docker.
# Override to kafka:9092 inside the Docker stack via compose environment block.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# ── Producer ─────────────────────────────────────────────────────────────────
# Idempotent producer: guarantees exactly-once delivery per partition/session.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# acks=all: waits for all in-sync replicas before acknowledging (durability).
spring.kafka.producer.acks=all
# Retries on transient broker failures (idempotence keeps ordering safe).
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# Include Spring-Kafka type header so consumers resolve the correct class automatically.
spring.kafka.producer.properties.spring.json.add.type.headers=true

# ── Consumer ─────────────────────────────────────────────────────────────────
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps JsonDeserializer so a poison-pill message is
# caught and forwarded to the DLT instead of crashing the consumer.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust only our own event package (principle of least privilege).
spring.kafka.consumer.properties.spring.json.trusted.packages=com.propnexium.kafka.event
# Start from latest — new consumer groups see only new messages, not history.
spring.kafka.consumer.auto-offset-reset=latest
# Manual acknowledgment — offset committed only AFTER successful processing.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

# Consumer group IDs — one isolated group per logical consumer.
kafka.consumer.group.email=propnexium-email-group
kafka.consumer.group.notification=propnexium-notification-group
kafka.consumer.group.saved-search=propnexium-saved-search-group

# ── Dead Letter Topics ────────────────────────────────────────────────────────
# After N failed attempts, the message is routed to <topic>.DLT.
kafka.retry.attempts=3
kafka.retry.backoff-ms=1000

# ── Per-Topic Feature Flags ───────────────────────────────────────────────────
# All default to FALSE (safe) — set to true once Kafka is running and verified.
# When false, the legacy @Async direct-call path is used as fallback.
kafka.topics.user-registered.enabled=${KAFKA_TOPICS_USER_REGISTERED_ENABLED:false}
kafka.topics.property-submitted.enabled=${KAFKA_TOPICS_PROPERTY_SUBMITTED_ENABLED:false}
kafka.topics.property-status-changed.enabled=${KAFKA_TOPICS_PROPERTY_STATUS_CHANGED_ENABLED:false}
kafka.topics.booking-created.enabled=${KAFKA_TOPICS_BOOKING_CREATED_ENABLED:false}
kafka.topics.booking-status-changed.enabled=${KAFKA_TOPICS_BOOKING_STATUS_CHANGED_ENABLED:false}
kafka.topics.inquiry-replied.enabled=${KAFKA_TOPICS_INQUIRY_REPLIED_ENABLED:false}
