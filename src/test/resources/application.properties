# Test-specific Kafka config — overrides application.properties during tests
# EmbeddedKafka broker ports are set per-test class in @EmbeddedKafka annotation
# The main app's bootstrap-servers must point to the embedded broker port
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

# Disable Kafka auto-configuration for tests that don't need a broker
# (unit tests use @MockBean KafkaTemplate instead)
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Use EARLIEST for integration tests so messages published before consumer start are still read
spring.kafka.consumer.auto-offset-reset=earliest

# Disable Kafka health indicator in tests (no real broker during unit tests)
management.health.kafka.enabled=false

# Per-topic flags — enable all for integration test verification
kafka.topics.user-registered.enabled=true
kafka.topics.property-submitted.enabled=true
kafka.topics.property-status-changed.enabled=true
kafka.topics.booking-created.enabled=true
kafka.topics.booking-status-changed.enabled=true
kafka.topics.inquiry-replied.enabled=true
